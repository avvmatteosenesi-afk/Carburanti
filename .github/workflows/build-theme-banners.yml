name: Build illustrated theme banners
on:
  push:
    paths:
      - 'scripts/build-theme-banners.py'
      - '.github/workflows/build-theme-banners.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/build-theme-banners.py
      - name: Commit generated self-contained images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-banners/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Build self-contained panoramic theme banners"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
