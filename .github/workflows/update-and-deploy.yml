name: Update fuel prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download MIMIT open-data base
        run: python scripts/update_data.py

      - name: Refresh current prices from official Osservaprezzi API
        shell: bash
        run: |
          if python scripts/refresh_prices_secondary.py; then
            echo "Osservaprezzi live API aggiornata correttamente."
          else
            echo "::warning::API live MIMIT non disponibile o incompleta: mantengo il fallback ufficiale già generato da update_data.py."
          fi

      - name: Validate data and release integrity
        run: python scripts/validate_release.py

      - name: Generate app icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_icons.py

      - name: Verify generated icons
        run: |
          test -s carburanti-green-180.png
          test -s carburanti-green-192.png
          test -s carburanti-green-512.png

      - name: Set up Node for mobile E2E
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run mobile viewport E2E tests
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy live smoke test
        run: python scripts/smoke_test_live.py
