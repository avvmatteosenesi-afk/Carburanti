name: Update fuel prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Diagnose MIMIT endpoints
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          endpoints = {
              "MIMIT anagrafica": "https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv",
              "MIMIT prezzi": "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv",
              "Archivio fallback": "https://raw.githubusercontent.com/LucaDDDD/benzina-data/main/data/last_update.json",
              "Osservaprezzi API": "https://carburanti.mise.gov.it/ospzApi/registry/region",
          }
          for label, url in endpoints.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"}, method="GET")
                  with urllib.request.urlopen(req, timeout=12) as response:
                      sample = response.read(160)
                      print(f"{label}: HTTP {response.status}, final_url={response.url}, type={response.headers.get('Content-Type')}, sample={sample[:100]!r}", flush=True)
              except Exception as exc:
                  print(f"::warning::{label}: {type(exc).__name__}: {exc}", flush=True)
          PY

      - name: Refresh MIMIT registry base with repository fallback
        shell: bash
        run: |
          if python scripts/update_data.py; then
            echo "Anagrafica MIMIT aggiornata correttamente."
          else
            echo "::error::Aggiornamento anagrafica MIMIT fallito: sorgente ufficiale e archivio indisponibili."
            test -s data/stations.json
            test -s data/stations-it.json
          fi

      - name: Refresh current prices from official Osservaprezzi API
        shell: bash
        run: |
          if python scripts/refresh_prices_secondary.py; then
            echo "Osservaprezzi live API aggiornata correttamente."
          else
            echo "::error::API Osservaprezzi indisponibile o incompleta; la validazione impedirà il deploy di prezzi obsoleti."
          fi

      - name: Validate data and release integrity
        run: python scripts/validate_release.py

      - name: Generate app icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_icons.py

      - name: Expand existing cartoon art across theme banners
        run: python scripts/expand_theme_banners.py

      - name: Verify generated icons
        run: |
          test -s carburanti-green-180.png
          test -s carburanti-green-192.png
          test -s carburanti-green-512.png

      - name: Set up Node for mobile E2E
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Run mobile viewport E2E tests
        run: npm run test:e2e

      - name: Build clean Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'scripts/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' \
            --exclude '*.log'
          test -s _site/index.html
          test -s _site/data/stations.json
          test -s _site/data/stations-it.json
          test -s _site/manifest.webmanifest

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy live smoke test
        run: python scripts/smoke_test_live.py
